name: rhm-infrastructure

services:
  postgres:
    image: postgres:17-alpine
    container_name: rhm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhm}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      EMPLOYEES_DB_USER: ${EMPLOYEES_DB_USER:-employees_service}
      EMPLOYEES_DB_PASSWORD: ${EMPLOYEES_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - rhm-network

volumes:
  postgres-data:
    name: rhm-postgres-data

networks:
  rhm-network:
    name: rhm-network
    driver: bridge
