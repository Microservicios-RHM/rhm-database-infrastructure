groups:
  - name: rhm-platform
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Service {{ $labels.job }} is unavailable"
      - alert: HighServerErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High 5xx rate in {{ $labels.service }}"
      - alert: DepartmentCircuitBreakerOpen
        expr: rhm_departments_circuit_breaker_open == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Department circuit breaker is open"
      - alert: RabbitMqQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) by (queue) > 50
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} has more than 50 ready messages"
