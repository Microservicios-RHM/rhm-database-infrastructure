groups:
  - name: rhm-platform
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Service {{ $labels.job }} is unavailable"
      - alert: HighServerErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High 5xx rate in {{ $labels.service }}"
