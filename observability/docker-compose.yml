services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
    networks: [microservices-network]

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [microservices-network]

  prometheus:
    image: prom/prometheus:v3.1.0
    command: --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [microservices-network]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "${JAEGER_HOST_PORT:-16686}:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [microservices-network]

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_FROM_ADDRESS: grafana@rhm.local
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, jaeger]
    networks: [microservices-network]

secrets:
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
